<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='static/css/style.css') }}">
    <title>Register</title>
</head>
<body>
    <header>
        <h1>Register for NRIIT Learning Management</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/courses">Courses</a>
            <a href="/trainers">Trainers</a>
            <a href="/register">Register</a>
            <a href="/login">Login</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>
    <main>
        <h2>Student Registration</h2>
        <form id="registerForm" method="POST">
            <label>Full Name</label><br>
            <input type="text" placeholder="Enter Your Name" id="name" name="name"><br>
            <label>Email</label><br>
            <input type="email" placeholder="Enter your email" id="email" name="email"><br>
            <label>Password</label><br>
            <input type="password" placeholder="Enter Your Password" id="password" name="password"><br>
            <label>Date of Birth</label><br>
            <input type="date" placeholder="DOB" name="dob"><br>
            <label>Gender</label><br>
            <input type="radio" name="gender" value="male">Male
            <input type="radio" name="gender" value="female">Female <br><br>
            <label>Select Course</label><br>
            <select>
                <option>Python FullStack</option>
                <option>Java FullStack</option>
            </select>
            <br>
            <button type="submit">Register</button>
        </form>
    </main>
    <script src="{{ url_for('static', filename='static/static/js/script.js') }}"></script>
</body>
</html>
